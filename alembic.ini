# Database migrations (Alembic). The database comes from DATABASE_URL, like the app.
#   python -m app.migrate status      - current and latest version
#   python -m app.migrate upgrade     - apply pending migrations (the app also does this at start-up)
#   python -m app.migrate new "add x" - create a new migration file in migrations/versions
[alembic]
script_location = migrations
file_template = %%(rev)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
