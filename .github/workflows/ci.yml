name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Lint (undefined names, unused imports, syntax errors)
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
    env:
      CI: "true"
      PAYLOAD_HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payloadhub_test
      KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Wait for Kafka
        run: |
          for i in $(seq 1 60); do
            python -c "import socket; socket.create_connection(('localhost', 9092), 2)" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Kafka did not start" && exit 1
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration and UI tests (PostgreSQL + Kafka)
        run: pytest tests/integration -q -rs
