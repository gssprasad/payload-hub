name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Lint (undefined names, unused imports, syntax errors)
        run: ruff check --output-format=github .
      - name: Lint the GitHub workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -no-color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
    env:
      CI: "true"
      PAYLOAD_HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payloadhub_test
      KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          sudo apt-get install -y -q postgresql-client
          pip install -r requirements-dev.txt
      - name: Wait for Kafka
        run: |
          for _ in $(seq 1 60); do
            python -c "import socket; socket.create_connection(('localhost', 9092), 2)" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Kafka did not start" && exit 1
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration and UI tests (PostgreSQL + Kafka)
        run: pytest tests/integration -q -rs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the monitoring config (alert rules, Prometheus config, generated dashboard)
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/p" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/alerts.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus" --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          cp monitoring/grafana/dashboards/payload-hub.json /tmp/committed.json
          python3 monitoring/build_dashboard.py && diff -q /tmp/committed.json monitoring/grafana/dashboards/payload-hub.json
      - name: Build the image
        run: docker build -t payload-hub:latest .
      - name: Start the stack (PostgreSQL, Kafka, backend, console)
        env:
          POSTGRES_PASSWORD: ci-db-pass
          ADMIN_PASSWORD: ci-admin-pass
        run: |
          PAYLOAD_HUB_SECRET_KEY=$(python3 -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          export PAYLOAD_HUB_SECRET_KEY
          docker compose up -d --wait --wait-timeout 300
      - name: Smoke test
        run: |
          pip install httpx
          python scripts/smoke_test.py http://localhost:8000 ci-admin-pass http://localhost:8501
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
